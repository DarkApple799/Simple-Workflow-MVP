<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wfa · 多 Agent Workflow 控制台</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2c; --panel2: #1e2637; --line: #2b3549;
    --fg: #e6ebf5; --muted: #93a0b8; --accent: #4f9dff; --ok: #35c68a;
    --warn: #f0b437; --bad: #f0616d; --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding: 16px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header .ver { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 22px 40px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); letter-spacing: .3px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: inherit; }
  textarea { min-height: 68px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > label { margin: 0; display: inline-flex; align-items: center; gap: 5px; }
  button { background: var(--accent); color: #04121f; border: 0; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; font: inherit; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 11px; font-family: var(--mono); padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); }
  .chip.agent { color: var(--accent); border-color: #2c4a75; }
  .chip.loop { color: var(--warn); border-color: #5a4620; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  #log { font-family: var(--mono); font-size: 12px; height: 280px; overflow: auto;
    background: #10151f; border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre-wrap; }
  #log .t { color: #6a7590; }
  #log .ev { color: var(--accent); }  #log .ok { color: var(--ok); }
  #log .err { color: var(--bad); }
  .status { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .status.running { color: var(--warn); border-color: #5a4620; }
  .status.success { color: var(--ok); border-color: #1f5b41; }
  .status.failed { color: var(--bad); border-color: #6b2b31; }
  #report { max-height: 620px; overflow: auto; background: #10151f; border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 16px; }
  #report pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; margin: 0; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
  .node { border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-family: var(--mono);
    background: var(--panel2); }
  .node.agent { border-color: #2c4a75; }
  .node.gate { border-color: #5a4620; color: var(--warn); }
  .node.parallel { border-color: #4a2c75; color: #b48bff; }
  .node.report { border-color: #1f5b41; color: var(--ok); }
  .arrow { color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel2); }
  .card h3 { margin: 0 0 6px; font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>wfa · 多 Agent Workflow 控制台</h1>
  <span class="ver" id="version">v—</span>
  <span class="spacer"></span>
  <span class="muted" id="health">检查服务中…</span>
</header>

<main>
  <!-- 左侧：配置 -->
  <section class="panel">
    <h2>① 选择流程</h2>
    <select id="workflow"></select>
    <div id="flow-desc" class="muted" style="margin-top:8px;font-size:12px"></div>
    <div class="flow" id="flow-graph"></div>

    <h2 style="margin-top:16px">② 任务与参数</h2>
    <label for="task">任务描述</label>
    <textarea id="task">实现一个订单金额计算与折扣结算模块，要求输入校验、异常处理与单元测试</textarea>
    <label for="workspace">工作区目录（产物写入此处，留空使用 examples/workflow_workspace）</label>
    <input type="text" id="workspace" placeholder="G:\\path\\to\\workspace" />
    <div class="row" style="margin-top:10px">
      <label><input type="checkbox" id="offline" checked /> 离线模式（不需要 API Key）</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="parallel" /> 并行审查</label>
      <label>最大迭代 <input type="text" id="maxIter" value="3" style="width:44px" /></label>
      <label>最大回合 <input type="text" id="maxTurns" value="50" style="width:52px" /></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="run">▶ 运行流程</button>
      <button class="ghost" id="refresh">刷新清单</button>
    </div>
    <div class="muted" style="margin-top:10px;font-size:12px" id="run-hint"></div>

    <h2 style="margin-top:18px">参与 Agent</h2>
    <div class="chips" id="agents"></div>
  </section>

  <!-- 右侧：运行 -->
  <section>
    <div class="panel">
      <h2>③ 执行事件流 <span class="status" id="status">未开始</span></h2>
      <div id="log" class="muted">等待运行…</div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>④ 运行报告</h2>
      <div id="report" class="muted">运行结束后在此显示结构化结果，完整 Markdown 报告见 <span class="mono">/api/runs/&lt;id&gt;/report</span>。</div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>⑤ 最近运行</h2>
      <table id="runs"><thead><tr><th>run_id</th><th>流程</th><th>模式</th><th>状态</th><th>开始</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { workflows: [], runId: null, since: 0, timer: null };

function fmtEvent(ev) {
  const p = ev.payload || {};
  const icon = { turn_start: "▶", turn_end: "◀", node_start: "·", node_end: "✓",
                 node_failed: "✗", parallel_start: "⑃", parallel_end: "⑃", stop: "■", error: "!" }[ev.event] || "·";
  let detail = "";
  if (ev.event === "turn_start") detail = `回合 ${p.turn}/${p.max_turns}`;
  else if (ev.event === "node_start") detail = `[${p.node}] agent=${p.agent || "-"} 迭代=${p.iteration ?? 0}`;
  else if (ev.event === "node_end") detail = `[${p.node}] ${p.status} decision=${p.decision || "-"} ${p.summary || ""}`;
  else if (ev.event === "node_failed") detail = `[${p.node}] ${p.error || ""}`;
  else if (ev.event === "parallel_start") detail = `[${p.node}] 并发子节点 ${JSON.stringify(p.children || [])}`;
  else if (ev.event === "stop") detail = `reason=${p.reason} status=${p.status}`;
  else detail = JSON.stringify(p).slice(0, 200);
  const cls = ev.event === "node_failed" || ev.event === "error" ? "err"
            : (ev.event === "node_end" ? "ok" : "ev");
  return `<span class="ev">${ev.at || ""}</span> <span class="${cls}">${icon} ${ev.event}</span> ${detail}`;
}

function appendLog(events) {
  const log = $("log");
  if (log.classList.contains("muted")) { log.classList.remove("muted"); log.textContent = ""; }
  for (const ev of events) {
    const line = document.createElement("div");
    line.innerHTML = fmtEvent(ev);
    log.appendChild(line);
  }
  log.scrollTop = log.scrollHeight;
}

async function loadCatalog() {
  const health = await (await fetch("/api/health")).json();
  $("version").textContent = "v" + health.version;
  $("health").textContent = "服务正常 · " + health.time;
  const data = await (await fetch("/api/workflows")).json();
  state.workflows = data.workflows || [];
  const sel = $("workflow");
  sel.innerHTML = state.workflows.map(w => `<option value="${w.name}">${w.name} —— ${w.description || ""}</option>`).join("");
  sel.onchange = renderFlow;
  renderFlow();
  const agents = await (await fetch("/api/agents")).json();
  $("agents").innerHTML = (agents.agents || [])
    .map(a => `<span class="chip agent" title="${(a.describe || "").replace(/"/g, "")}">${a.name} · ${a.role}</span>`).join("");
}

function renderFlow() {
  const wf = state.workflows.find(w => w.name === $("workflow").value);
  if (!wf) return;
  $("flow-desc").textContent = wf.description || "";
  const nodes = wf.nodes || [];
  const html = nodes.map((n, i) => {
    const cls = n.type === "gate" ? "gate" : (n.type === "parallel" ? "parallel" : (n.type === "route" ? "report" : "agent"));
    const arrow = i ? '<span class="arrow">→</span>' : "";
    const loop = n.loop_of ? ` ⟲${n.loop_of}` : "";
    return `${arrow}<span class="node ${cls}" title="${(n.description || "").replace(/"/g, "")}">${n.id}${loop}</span>`;
  }).join("");
  $("flow-graph").innerHTML = html;
}

async function startRun() {
  $("run").disabled = true;
  $("log").classList.add("muted");
  $("log").textContent = "启动中…";
  $("report").classList.add("muted");
  $("report").textContent = "运行中…";
  $("status").className = "status running";
  $("status").textContent = "运行中";
  state.since = 0;
  const body = {
    workflow: $("workflow").value,
    task: $("task").value,
    workspace: $("workspace").value,
    offline: $("offline").checked,
    parallel_review: $("parallel").checked,
    max_iterations: parseInt($("maxIter").value || "3", 10),
    max_turns: parseInt($("maxTurns").value || "50", 10),
  };
  const res = await (await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
  if (!res.run_id) { $("log").textContent = "启动失败：" + JSON.stringify(res); $("run").disabled = false; return; }
  state.runId = res.run_id;
  $("run-hint").textContent = "run_id = " + res.run_id;
  poll();
}

async function poll() {
  if (!state.runId) return;
  const data = await (await fetch(`/api/runs/${state.runId}?since=${state.since}`)).json();
  appendLog(data.events || []);
  state.since = data.event_count ?? state.since;
  $("status").className = "status " + (data.status || "running");
  $("status").textContent = data.status || "running";
  if (data.report && data.report.status) {
    renderReport(data.report);
  }
  if (data.status === "running") { state.timer = setTimeout(poll, 600); }
  else { $("run").disabled = false; loadRuns(); }
}

function renderReport(rep) {
  const el = $("report");
  el.classList.remove("muted");
  const counts = rep.counts || {};
  const issues = rep.issues || [];
  const rows = issues.slice(0, 50).map((it, i) =>
    `<tr><td>${i + 1}</td><td>${it.severity || ""}</td><td class="mono">${it.file || ""}${it.line ? ":" + it.line : ""}</td><td>${it.title || ""}</td></tr>`).join("");
  el.innerHTML = `
    <div class="grid2">
      <div class="card"><h3>运行概览</h3>
        <div>状态：<b>${rep.status}</b>　回合：${rep.turns}　耗时：${rep.duration}s</div>
        <div>消息数：${rep.message_count}　产物：${Object.keys(rep.artifacts || {}).length}</div>
        <div>问题分级：${JSON.stringify(counts)}</div>
      </div>
      <div class="card"><h3>节点时间线</h3>
        <table><thead><tr><th>回合</th><th>节点</th><th>状态</th><th>摘要</th></tr></thead><tbody>
        ${(rep.node_runs || []).map(r => `<tr><td>${r.turn}</td><td class="mono">${r.node_id}</td><td>${r.status}</td><td>${(r.summary || "").slice(0, 80)}</td></tr>`).join("")}
        </tbody></table>
      </div>
    </div>
    <div class="card"><h3>问题清单（前 50 条）</h3>
      <table><thead><tr><th>#</th><th>严重</th><th>位置</th><th>问题</th></tr></thead><tbody>${rows || '<tr><td colspan="4">无</td></tr>'}</tbody></table>
    </div>
    <div class="card"><h3>原始 Markdown 报告</h3>
      <button class="ghost" onclick="window.open('/api/runs/${state.runId}/report','_blank')">在新窗口打开</button>
    </div>`;
}

async function loadRuns() {
  const data = await (await fetch("/api/runs")).json();
  $("runs").querySelector("tbody").innerHTML = (data.runs || []).slice().reverse().slice(0, 10).map(r =>
    `<tr><td class="mono">${r.run_id}</td><td>${r.workflow}</td><td>${r.mode}</td><td>${r.status}</td><td class="muted">${r.created_at}</td></tr>`
  ).join("");
}

$("run").onclick = startRun;
$("refresh").onclick = loadCatalog;
loadCatalog();
loadRuns();
</script>
</body>
</html>
